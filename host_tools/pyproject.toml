[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ota-upload-tools"
version = "1.0.0"
description = "Host-side tools and idf.py extension for ota_upload"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ota-upload = "ota_upload_tools.uploader:main"

[project.entry-points.idf_extension]
ota_upload_ext = "ota_upload_tools.idf_ext:action_extensions"

[tool.setuptools.packages.find]
where = ["src"]
